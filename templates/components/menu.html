{% load i18n %}
{% url 'dashboard:home' as dashboard_url %}
<a class="nav-item {% if request.path == dashboard_url %}active{% endif %}" href="{{ dashboard_url }}">
  <i class="bi bi-speedometer2"></i><span class="brand-text">{% trans "Dashboard" %}</span>
</a>
<a class="nav-item {% if '/customers/' in request.path %}active{% endif %}" href="{% url 'customers:list' %}">
  <i class="bi bi-people"></i><span class="brand-text">{% trans "Customers" %}</span>
</a>
<a class="nav-item {% if '/loans/' in request.path %}active{% endif %}" href="{% url 'loans:list' %}">
  <i class="bi bi-file-earmark-text"></i><span class="brand-text">{% trans "Loans" %}</span>
</a>
<a class="nav-item {% if '/payments/' in request.path %}active{% endif %}" href="{% url 'payments:list' %}">
  <i class="bi bi-cash-stack"></i><span class="brand-text">{% trans "Payments" %}</span>
</a>
{% if user_permissions.view_collections %}
<a class="nav-item {% if request.path == '/collections/' %}active{% endif %}" href="{% url 'collections:board' %}">
  <i class="bi bi-clipboard-check"></i><span class="brand-text">{% trans "Collections" %}</span>
</a>
<a class="nav-item {% if 'my-portfolio' in request.path %}active{% endif %}" href="{% url 'collections:my_portfolio' %}">
  <i class="bi bi-person-walking"></i><span class="brand-text">{% trans "My portfolio" %}</span>
</a>
{% endif %}
