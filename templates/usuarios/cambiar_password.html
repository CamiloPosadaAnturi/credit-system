{% extends "base.html" %}
{% block encabezado %}Cambiar contrasena{% endblock %}
{% block contenido %}
<div class="row"><div class="col-lg-5">
<div class="tarjeta"><div class="tarjeta-cuerpo">
  <p class="small text-secondary">Usuario: <strong>{{ usuario_detalle }}</strong></p>
  <form method="post" data-una-vez>
    {% csrf_token %}
    {% for campo in form %}<div class="mb-3">{% include "components/campo.html" with campo=campo %}</div>{% endfor %}
    <button class="btn btn-primary" type="submit">Guardar</button>
    <a class="btn btn-borde" href="{% if propio %}{% url 'usuarios:perfil' %}{% else %}{% url 'usuarios:detalle' usuario_detalle.pk %}{% endif %}">Cancelar</a>
  </form>
</div></div>
</div></div>
{% endblock %}
